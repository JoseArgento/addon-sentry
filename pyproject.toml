[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "addon-sentry"
version = "0.1.0"
description = "Checks a World of Warcraft addon (zip or folder) for warning signs before you install it: backdoors, gold-moving tricks, hidden code, executables."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "José Argento" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["world-of-warcraft", "addon", "lua", "security", "malware", "scanner"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/JoseArgento/addon-sentry"

[project.scripts]
addon-sentry = "addon_sentry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/addon_sentry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
