name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pytest ruff
      - run: ruff check src tests tools
      - run: pytest -q
      - name: Page is up to date
        run: |
          python tools/export_rules.py && python tools/build_web.py
          git diff --exit-code web/rules.json
